services:
  postgres:
    image: postgres:16
    container_name: board-games-postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: board_games_app
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
